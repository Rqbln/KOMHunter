# KOMHunter Docker Compose Configuration

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: komhunter-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REDIRECT_URI=http://localhost:8000/api/auth/callback
      # No fallback on purpose: fail loudly if JWT_SECRET_KEY is not provided
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (e.g. openssl rand -hex 32)}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: komhunter-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Redis for caching (future)
  # redis:
  #   image: redis:7-alpine
  #   container_name: komhunter-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

networks:
  default:
    name: komhunter-network
